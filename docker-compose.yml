version: "2"
services:
  staynest-web:
    build: .
    image: staynest-web:latest
    depends_on:
      - staynest-db
    links:
      - staynest-db
    ports:
      - "8080:8080"
    environment:
      - db_string=mysql+pymysql://root:root@staynest-db/qa327
    command:  ["./wait-for-it.sh", "staynest-db:3306", "--strict" , "--timeout=300", "--", "python", "-m", "qbay"]
    networks:
      - staynest-site

  staynest-db:
    platform: linux/x86_64
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
    command: --init-file /data/application/init.sql
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./db_init.sql:/data/application/init.sql
    networks:
      - staynest-site

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on: 
      - staynest-db
    environment:
      PMA_HOST: staynest-db
      PMA_ARBITRARY: 1
    restart: always
    ports:
      - 8082:80
    networks:
      - staynest-site

networks:
  staynest-site:
